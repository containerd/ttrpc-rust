name: BVT
on: [pull_request]

permissions:
  contents: read

jobs:
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.80.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Rust
        run: |
          rustup toolchain install 1.80.0 --profile minimal
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Test runtime and code generators
        run: |
          cargo test --workspace --features async,sync,security_extension
          cargo test -p ttrpc --no-default-features --features sync,async,prost
          cargo test --manifest-path ttrpc-codegen-prost/Cargo.toml
          cargo check --manifest-path example-prost/Cargo.toml --examples

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Check
        run: |
          make check-all
          # The ttrpc-codegen-prost crate is a standalone workspace root, so its checks
          # must be invoked explicitly (protoc is required for its tests).
          make -C ttrpc-codegen-prost check

  make:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Build
        run: |
          make
          make -C compiler
          make -C ttrpc-codegen
          make -C example build-examples
          make -C example-prost build-examples
          make -C ttrpc-codegen-prost test
        # Keep bash so a native-command failure on Windows isn't masked by a
        # later successful command (PowerShell swallows non-zero exits).
        shell: bash

  security-extension:
    name: Security Extension Tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [rustprotobuf, prost]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Run tests with security_extension
        run: |
          cargo test --no-default-features --features "async,sync,security_extension,${{ matrix.backend }}" --verbose

  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans sources

    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - uses: actions/checkout@v3
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
