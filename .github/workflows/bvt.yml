name: BVT
on: [pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Check
        run: |
          make check-all
          # The codegen crate is a standalone workspace root, so its checks
          # must be invoked explicitly (protoc is required for its tests).
          make -C codegen check

  make:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Protoc
        run: ./install_protoc.sh
        shell: bash
      - name: Build
        run: |
          make
          make -C compiler
          make -C ttrpc-codegen
          make -C example build-examples
          make -C example-prost build-examples
          make -C codegen test
        # Keep bash so a native-command failure on Windows isn't masked by a
        # later successful command (PowerShell swallows non-zero exits).
        shell: bash

  security-extension:
    name: Security Extension Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run tests with security_extension
        run: |
          cargo test --features "async,sync,security_extension" --verbose

  deny:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans sources

    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - uses: actions/checkout@v3
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
