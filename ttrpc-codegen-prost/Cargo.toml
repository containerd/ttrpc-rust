[package]
name = "ttrpc-codegen-prost"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["The Ant Group Kata Team <kata@list.alibaba-inc.com>"]
license = "Apache-2.0"
keywords = ["codegen", "ttrpc", "protobuf"]
description = "Rust codegen for ttrpc using prost crate"
categories = ["network-programming", "development-tools::build-utils"]
repository = "https://github.com/containerd/ttrpc-rust/tree/master/ttrpc-codegen-prost"
homepage = "https://github.com/containerd/ttrpc-rust/tree/master/ttrpc-codegen-prost"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# This crate is intentionally a standalone workspace root (decoupled from the
# rustprotobuf-oriented root workspace).
[workspace]

[dependencies]
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
proc-macro2 = "1.0"
quote = "1.0"
# Keep transitive prost-build dependencies compatible with Cargo 1.80.
tempfile = ">=3.0, <3.25"
indexmap = ">=2.0, <2.12"
